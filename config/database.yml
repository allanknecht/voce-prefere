# SQLite for local development and tests only.
# Production uses PostgreSQL through DATABASE_URL (Neon, Render Postgres, ...).
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: the database defined as "test" is erased and re-generated by the test run.
test:
  <<: *default
  database: storage/test.sqlite3

production:
  adapter: postgresql
  url: <%= ENV["DATABASE_URL"] %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 3 } %>
  # Neon scales to zero after a few idle minutes: give the first connection time to wake up.
  connect_timeout: 15
