# Render Blueprint: free web service + external free Postgres (Neon).
# Render's free tier has no persistent disk, so the database lives at Neon.
services:
  - type: web
    name: voce-prefere
    runtime: docker
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        sync: false        # paste the Neon connection string (…?sslmode=require) in the dashboard
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true
      - key: RAILS_LOG_LEVEL
        value: info
